# Project-local knowledge-store config.
#
# Generated by `faculty init` / `faculty knowledge projects add`.
# Merged with ~/.faculty/config.yaml when your cwd is inside this
# repo; outside it, nothing here loads.

knowledge:
  sources:
    - name: lilygo-claude
      scope: project
      path: .faculty/knowledge

# Business unit this repo belongs to. The review gate reads this to
# resolve BU-scoped knowledge from the baked review image. Leave blank
# to review against org + project scope only.
business_unit: ""
