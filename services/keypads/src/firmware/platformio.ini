; keypads firmware for the LilyGO T-Keyboard-S3-Pro.
; Design: docs/architecture/keypads.md
; Board JSON and build settings follow LilyGO's arduino-esp32-libs_V2.0.14
; branch (commit cb41b375c6e20f3204dcd246001c6a405c3f9fd7).
;
;   pio run -e keypads -t upload    the firmware
;   pio run -e spike -t upload      hardware spike + screen calibration
;   pio test -e native              protocol parser tests (runs on the Mac)

[platformio]
boards_dir = boards
src_dir = .
default_envs = keypads

[esp]
platform = espressif32 @ 6.5.0
board = lilygo_t_keyboard_pro_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi ; 8 MB OPI PSRAM (needed for key faces)
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
lib_deps =
    moononournation/GFX Library for Arduino @ 1.3.7
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
test_ignore = *

[env:keypads]
extends = esp
build_src_filter = +<src/>

; Step 1 of the delivery plan: screens, keys, knob, expansion detection,
; and per-screen calibration (offset and tilt).
[env:spike]
extends = esp
build_src_filter = +<spike/>

[env:native]
platform = native
build_src_filter = -<*>
